[project]
name = "finance-tracker"
version = "0.1.0"
description = "Self-hosted personal finance tracker"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    "rich>=13.0",       # terminal output
    "typer>=0.12",      # CLI framework
    "pandas>=2.0",      # data wrangling
    "pydantic>=2.0",    # data models
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov",
    "ruff",
]

[project.scripts]
finance-tracker = "finance_tracker.__main__:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/finance_tracker"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
